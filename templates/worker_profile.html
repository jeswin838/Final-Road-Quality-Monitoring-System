{% extends "base.html" %}
{% block title %}Worker Profile — PotholePro{% endblock %}
{% block page_title %}My Profile{% endblock %}

{% block content %}
<div class="wk-profile-header wk-animate-fade-in-up">
  <div class="wk-profile-avatar">
    <i class="fa-solid fa-user-astronaut"></i>
  </div>
  <div class="wk-profile-info">
    <h1 id="pName" class="worker-gradient-text">Loading...</h1>
    <p id="pDesig">Loading...</p>
    <div class="wk-mt-3 wk-flex-start wk-gap-4">
      <span class="wk-badge wk-badge-status-completed" id="pHeaderStatus">---</span>
    </div>
  </div>
</div>

<div class="wk-animate-slide-up delay-100" style="max-width: 900px; margin-top: 24px;">
  <div class="wk-card worker-glass">
    <div class="wk-card-header">
      <div class="wk-card-title">
        <div class="wk-card-icon"><i class="fa-solid fa-address-card"></i></div>
        Account Details
      </div>
    </div>
    <div class="wk-dash-grid"
      style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin-bottom:0; gap: 20px;">
      <div class="wk-flex-column wk-gap-1">
        <label class="worker-small">Worker Name</label>
        <div class="worker-h4" id="pDetailName">---</div>
      </div>
      <div class="wk-flex-column wk-gap-1">
        <label class="worker-small">Email Address</label>
        <div class="worker-h4" id="pEmail">---</div>
      </div>
      <div class="wk-flex-column wk-gap-1">
        <label class="worker-small">Phone Number</label>
        <div class="worker-h4" id="pPhone">---</div>
      </div>
      <div class="wk-flex-column wk-gap-1">
        <label class="worker-small">Team Name</label>
        <div class="worker-h4" id="pTeam">---</div>
      </div>
      <div class="wk-flex-column wk-gap-1">
        <label class="worker-small">Designation</label>
        <div class="worker-h4" id="pDesignation">---</div>
      </div>
      <div class="wk-flex-column wk-gap-1">
        <label class="worker-small">Worker ID</label>
        <div class="worker-h4" id="pEmpId">---</div>
      </div>
      <div class="wk-flex-column wk-gap-1">
        <label class="worker-small">Current Status</label>
        <div class="worker-h4"><span class="wk-badge wk-badge-status-completed" id="pStatus">---</span></div>
      </div>
      <div class="wk-flex-column wk-gap-1">
        <label class="worker-small">Joined Date</label>
        <div class="worker-h4" id="pCreated">---</div>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await fetch('/api/worker/profile');
      if (res.ok) {
        let data = await res.json();
        if (data && data.success !== undefined) data = data.data;

        const name = data.name || 'Not Available';
        const designation = data.designation || 'N/A';
        const email = data.email || 'Not Available';
        const phone = data.phone || 'Not Available';
        const teamName = data.team_name || data.team || 'Not Assigned';
        const workerId = data.id !== undefined && data.id !== null ? data.id : 'N/A';
        const status = data.worker_status || 'Available';
        const created = data.created_at ? new Date(data.created_at).toLocaleDateString() : 'N/A';

        document.getElementById('pName').textContent = name;
        document.getElementById('pDetailName').textContent = name;
        document.getElementById('pDesig').textContent = designation;
        document.getElementById('pDesignation').textContent = designation;
        document.getElementById('pEmpId').textContent = workerId;
        document.getElementById('pTeam').textContent = teamName;
        document.getElementById('pEmail').textContent = email;
        document.getElementById('pPhone').textContent = phone;
        document.getElementById('pStatus').textContent = status;
        document.getElementById('pHeaderStatus').textContent = status;
        document.getElementById('pCreated').textContent = created;
      }
    } catch (e) {
      console.error('Error fetching worker profile:', e);
    }
  });
</script>
{% endblock %}
